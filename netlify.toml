# Netlify configuration. The Next.js runtime (OpenNext adapter) is applied
# automatically; no Netlify-specific code lives in the app.

[build]
  command = "npm run build"
  publish = ".next"
  # Only build production (main) and deploy previews. Anything else — notably
  # the `status` branch the uptime workflow commits to every 5 minutes — is
  # skipped so it never consumes build credits. Exit code 0 = skip build.
  ignore = 'if [ "$CONTEXT" = "production" ] || [ "$CONTEXT" = "deploy-preview" ]; then exit 1; else exit 0; fi'

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
